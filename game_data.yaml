nodes:
  start:
    start: true
    name: Der Startschuss
    short: Start
    blurb: Es klingelt gleich. Drei Routen liegen vor dir.
    intro: >-
      Noch wenige Minuten bis zur großen Pause. Im hintersten Winkel der
      Schulküche wartet der allerletzte Schoko-Donut, und du bist nicht der
      Einzige, der davon gehört hat. Plane deine Route, beweg dich leise,
      und sei zuerst an der Theke – bevor es klingelt.
    entryText: >-
      Du bist zurück am Ausgangspunkt. Die Cafeteria-Uhr tickt wie ein
      Countdown, die Pausenglocke lauert.
    exitText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan, wählst
      blitzschnell und legst los.

  sporthalle:
    name: Die Sporthalle
    short: Sport.
    blurb: Bälle fliegen, Pfeifen schrillen – und mittendrin ein strenger Blick.
    entryText: >-
      Du erreichst Hausmeister Brzenska. Er verlangt wortlos deinen
      Schülerausweis und stempelt ihn dreimal.
    exitText: >-
      Er reicht dir den Ausweis zurück, salutiert knapp und deutet auf die
      nächste Kontrollstelle.

  bibliothek:
    name: Die Bibliothek
    short: Biblio.
    blurb: Angeblich der leiseste Ort der Schule. Angeblich.
    entryText: >-
      Die Bibliothekarin bewegt sich lautlos wie eine Spezialeinheit
      zwischen den Regalen, Zwille im Anschlag.
    exitText: >-
      Ein Klick, ein Zwirbeln – ein Haargummi schnalzt dir haarscharf am
      Ohr vorbei, dann bist du durch die Tür.

  nw_trakt:
    name: Der NW-Trakt
    short: NW-Trakt
    blurb: Kühl, eng, kurz. Fast zu praktisch.
    entryText: >-
      Du erreichst die kühle Kellertreppe und nimmst die letzten Stufen mit
      einem einzigen großen Satz.
    exitText: >-
      Du stößt dich vom eiskalten Geländer ab und verschwindest durch den
      nächsten schmalen Durchgang.

  pausenhalle:
    name: Die Pausenhalle
    short: Halle
    blurb: Der Knotenpunkt der Schule. Hier laufen alle Wege zusammen.
    entryText: >-
      Am Wasserspender blockiert eine Traube Drittklässler das
      Rätsel-Schloss.
    exitText: >-
      Du flüsterst die Lösung, drückst für sie den Knopf und schlüpfst
      weiter.

  ziel:
    goal: true
    name: Die Theke – der letzte Donut
    short: Theke
    blurb: Ein Spotlight, ein Donut – die Frage ist nur, wessen Hand ihn schon hält.
    entryText: >-
      Du kommst um die letzte Ecke: ein Lichtkegel fällt auf die Theke,
      genau auf den letzten Donut – und auf eine Hand, die schon danach
      greift.
    exitText: >-
      Mit dem Donut sicher in der Hand drehst du dich noch einmal um und
      suchst die anderen im Gang.

# Topologie basierte ursprünglich auf dem bekannten Wikipedia-Beispielgraphen
# zu Dijkstras Algorithmus (Knoten 1-6), inzwischen um Pausenhalle erweitert
# und um Lehrer wieder verkleinert, um die Zahl der im Spiel überhaupt
# möglichen Wege auf ein für eine Klasse sinnvolles Maß zu bringen (37 -> 23
# mögliche Wege insgesamt, davon 10 zum Ziel). Die neue Kante
# bibliothek-keller ersetzt die frühere Anbindung über lehrer.
#
# Das Gewicht ist wieder ganz regulär die Textlänge (kein `weight`-Override
# mehr). Alle entryText/exitText liegen bei ca. 100 Zeichen; die relative
# Größenordnung der Original-Gewichte wird stattdessen über das optionale
# `extra`-Feld je Kante nachgebildet – ein kurzer Gang-/Umwegtext, der beim
# Zusammensetzen zwischen exitText und entryText eingefügt wird. Das braucht
# es hier zwingend: unter reiner Textlängen-Gewichtung (ohne `extra`) kann ein
# Umweg über einen Zwischenknoten nie günstiger sein als eine direkte Kante
# zwischen denselben zwei Knoten, weil der Umweg zusätzlich noch die (nicht
# negative) Textlänge des Zwischenknotens selbst trägt. Das `extra`-Feld ist
# pro Kante frei wählbar und unabhängig von den Knotentexten, daher lässt
# sich damit trotzdem eine echte Dijkstra-Relaxation abbilden.
#
# `pausenhalle` ist ein zusätzlicher Knotenpunkt (an nw_trakt und ziel
# angebunden) mit bewusst kurzen Texten. Weil Kosten in diesem Spiel exakt
# der Simulationszeit entsprechen, kommt eine
# Tabellen-Aktualisierung (ein bereits eingetragener Wert wird durch einen
# besseren ersetzt) hier nie vor - wer zuerst ankommt, hat zwangsläufig den
# günstigsten bekannten Weg genommen. Die eigentliche Dijkstra-Pointe
# ("mehr, aber günstigere Stationen schlagen wenige teure") zeigt sich
# stattdessen im Vergleich zwischen Schüler:innen: der Weg über die
# Pausenhalle (start-sporthalle-nw_trakt-pausenhalle-ziel, 4 Stationen)
# schlägt sowohl den direkten 2-Stationen-Weg (start-nw_trakt-ziel) als auch
# den vorherigen 3-Stationen-Bestweg (start-sporthalle-nw_trakt-ziel) klar.
#
# Knotennamen sind bewusst neutral (Ort, nicht Figur/Ereignis): „Sporthalle“
# statt „Hausmeister“, „NW-Trakt“ statt „Keller“, damit der Graph selbst
# nichts von der Story verrät - die verrät sich ausschließlich über den
# gelesenen Text.
edges:
  - from: start
    to: sporthalle
    extra: >-
      Der Weg zur Hausmeisterloge führt mitten durch die Turnhalle, wo
      gerade ein Völkerballspiel tobt; du duckst dich unter zwei Bällen
      weg, springst über einen dritten und erreichst, leicht außer Atem,
      die schwere Tür mit dem Schild „Hausmeisterei“.
  - from: start
    to: nw_trakt
    extra: >-
      Der direkte Weg zum Keller führt über eine improvisierte
      Hürdenstrecke aus Schulranzen, die eine ganze Klasse mitten im Flur
      liegen gelassen hat; beim Sprung über den letzten Ranzen verlierst
      du das Gleichgewicht und schlägst dir hart das Knie auf. Der
      Schulsanitätsdienst ist sofort zur Stelle – zwei Fünftklässler mit
      Verbandskasten und grimmiger Entschlossenheit –, doch bevor sie auch
      nur ein Pflaster auspacken dürfen, muss erst ein dreiseitiges
      Unfallprotokoll ausgefüllt werden, mit Durchschlag, Unterschrift der
      Klassenleitung und einer Skizze des Tathergangs, die keiner von euch
      dreien wirklich hinbekommt, während die Minuten bis zum Pausenende
      ungerührt weiterlaufen.
  - from: sporthalle
    to: bibliothek
    extra: >-
      Von der Hausmeisterei aus geht es über den Hinterflur, vorbei am
      Lager mit den Ersatzstühlen und einem Stapel alter Wandkarten, die
      niemand mehr braucht, dann eine kurze Treppe hoch, an der Schulküche
      vorbei, aus der es nach angebranntem Toast riecht, und schließlich
      durch die unscheinbare Seitentür, die direkt in die Bibliothek führt,
      vorbei am Aushang für die nächste Buchausstellung.
  - from: sporthalle
    to: nw_trakt
    extra: >-
      Du duckst dich unter dem letzten Ball weg, stolperst durch die
      Seitentür – und stehst plötzlich mitten im NW-Trakt.
  - from: bibliothek
    to: ziel
    extra: >-
      Du kletterst kurzerhand aus dem Bibliotheksfenster, landest im Beet
      und stürmst durch die Hintertür in die Küche, wo die zwergenhaften
      Küchenkräfte entsetzt aufkreischen.
  - from: nw_trakt
    to: ziel
    extra: >-
      Herr Dr. Kessler, hochmotivierter Physiklehrer, hat aus dem Fenster
      des NW-Trakts eine improvisierte Seilbahn gespannt – „ideal für den
      Fallversuch!“ – und schnallt dich, bevor du protestieren kannst, in
      einen selbstgenähten Fallschirm, der sich erst zwei Meter über dem
      Boden mit einem lauten Rucken öffnet, mit dem du reichlich unsanft
      direkt vor der Cafeteria landest.
  - from: pausenhalle
    to: nw_trakt
    extra: >-
      Die Treppe zum NW-Trakt liegt direkt neben dem Ausgang der
      Pausenhalle.
  - from: pausenhalle
    to: ziel
    extra: >-
      Die Cafeteria-Theke ist nur einen Sprung von der Pausenhalle
      entfernt.
  - from: bibliothek
    to: nw_trakt
    extra: >-
      Die Bibliothekarin packt dich am Kragen und wirft dich kurzerhand
      aus der Seitentür – und du stehst plötzlich mitten im NW-Trakt.
