nodes:
  start:
    start: true
    name: Der Startschuss
    short: Start
    blurb: Es klingelt gleich. Drei Routen liegen vor dir.
    intro: >-
      Noch wenige Minuten bis zur großen Pause. Im hintersten Winkel der
      Schulküche wartet der allerletzte Schoko-Donut, und du bist nicht der
      Einzige, der davon gehört hat. Plane deine Route, beweg dich leise,
      und sei zuerst an der Theke – bevor es klingelt.

  sporthalle:
    name: Die Sporthalle
    short: Sport.
    blurb: Bälle fliegen, Pfeifen schrillen – und mittendrin ein strenger Blick.

  bibliothek:
    name: Die Bibliothek
    short: Biblio.
    blurb: Angeblich der leiseste Ort der Schule. Angeblich.

  nw_trakt:
    name: Der NW-Trakt
    short: NW-Trakt
    blurb: Kühl, eng, kurz. Fast zu praktisch.

  pausenhalle:
    name: Die Pausenhalle
    short: Halle
    blurb: Der Knotenpunkt der Schule. Hier laufen alle Wege zusammen.

  ziel:
    goal: true
    name: Die Theke – der letzte Donut
    short: Theke
    blurb: Ein Spotlight, ein Donut – die Frage ist nur, wessen Hand ihn schon hält.

# Topologie basierte ursprünglich auf dem bekannten Wikipedia-Beispielgraphen
# zu Dijkstras Algorithmus (Knoten 1-6), inzwischen um Pausenhalle erweitert
# und um Lehrer wieder verkleinert, um die Zahl der im Spiel überhaupt
# möglichen Wege auf ein für eine Klasse sinnvolles Maß zu bringen (37 -> 23
# mögliche Wege insgesamt, davon 10 zum Ziel).
#
# Der Text (und damit das Gewicht) lebt komplett auf den Kanten: jede Kante
# trägt ein eigenständiges `forwardText` (von -> zu) und `backwardText`
# (zu -> von), Gewicht = Textlänge. Es gibt bewusst keine Knotentexte
# (entryText/exitText) mehr, die frühere Variante setzte den abgespielten
# Text aus Knotentext + optionalem Kantenzusatz zusammen - das führte
# einerseits zu Dopplungen (derselbe Satz tauchte auf mehreren Kanten auf,
# die denselben Knoten berühren), andererseits war es semantisch unsauber:
# derselbe Kantenzusatz wurde für beide Richtungen wiederverwendet, obwohl
# er inhaltlich oft nur in einer Richtung Sinn ergab. Mit eigenständigem
# Text pro Kante und Richtung ist beides behoben, und nebenbei entfällt
# auch die alte Einschränkung, dass ein Umweg über einen Zwischenknoten nie
# günstiger sein konnte als eine direkte Kante (das war zwingend, solange
# Knotentext von mehreren Kanten gemeinsam genutzt wurde) - jede Kante ist
# jetzt vollständig frei wählbar.
#
# `pausenhalle` hat weiterhin bewusst kurze Kantentexte - das ist tragend
# für die Waage: jede Verlängerung an anderer Stelle braucht eine erneute
# Prüfung, ob die Marge zur direkten Route noch hält. Weil Kosten in diesem
# Spiel exakt der Simulationszeit entsprechen, kommt eine
# Tabellen-Aktualisierung (ein bereits eingetragener Wert wird durch einen
# besseren ersetzt) hier nie vor - wer zuerst ankommt, hat zwangsläufig den
# günstigsten bekannten Weg genommen. Die eigentliche Dijkstra-Pointe
# ("mehr, aber günstigere Stationen schlagen wenige teure") zeigt sich
# stattdessen im Vergleich zwischen Schüler:innen: der Weg über die
# Pausenhalle (start-sporthalle-nw_trakt-pausenhalle-ziel, 4 Stationen)
# schlägt sowohl den direkten 2-Stationen-Weg (start-nw_trakt-ziel) als auch
# den vorherigen 3-Stationen-Bestweg (start-sporthalle-nw_trakt-ziel) klar.
#
# Knotennamen sind bewusst neutral (Ort, nicht Figur/Ereignis): „Sporthalle“
# statt „Hausmeister“, „NW-Trakt“ statt „Keller“, damit der Graph selbst
# nichts von der Story verrät - die verrät sich ausschließlich über den
# gelesenen Text.
edges:
  - from: start
    to: sporthalle
    forwardText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan,
      kalkulierst kurz die Chancen gegen die Konkurrenz und legst
      blitzschnell los. Der Weg zur Sporthalle führt direkt an Hausmeister
      Brzenskas Kontrollposten vorbei; er verlangt wortlos deinen
      Schülerausweis, dreht ihn zweimal im Licht, stempelt ihn gleich
      dreimal und mustert dich mit zusammengekniffenen Augen, bevor er
      dich endlich durch die schwere Tür zur Halle winkt. Du stolperst
      mitten in ein tobendes Völkerballspiel; gleich drei Bälle fliegen
      synchron auf dich zu, und irgendjemand brüllt begeistert deinen
      Namen.
    backwardText: >-
      Du duckst dich unter dem letzten Wurf weg, hechtest im Slalom um
      zwei Mitspieler und wirfst dich zur rettenden Seitentür hinaus.
      Hausmeister Brzenska hält dich noch einmal auf, verlangt erneut
      deinen Schülerausweis, nickt diesmal knapp und winkt dich durch. Du
      bist zurück am Ausgangspunkt. Die Cafeteria-Uhr tickt wie ein
      Countdown, die Pausenglocke lauert bedrohlich nah, und irgendwo
      klappert schon das erste Tablett.
  - from: start
    to: nw_trakt
    forwardText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan,
      kalkulierst kurz die Chancen gegen die Konkurrenz und legst
      blitzschnell los. Der direkte Weg zum NW-Trakt führt über eine
      improvisierte Hürdenstrecke aus Schulranzen, die eine ganze Klasse
      mitten im Flur liegen gelassen hat; beim Sprung über den letzten
      Ranzen verlierst du das Gleichgewicht und schlägst dir hart das Knie
      auf. Der Schulsanitätsdienst ist sofort zur Stelle – zwei
      Fünftklässler mit Verbandskasten und grimmiger Entschlossenheit –,
      doch bevor sie auch nur ein Pflaster auspacken dürfen, muss erst ein
      dreiseitiges Unfallprotokoll ausgefüllt werden, mit Durchschlag,
      Unterschrift der Klassenleitung und einer Skizze des Tathergangs,
      während die beiden Sanitäter sich zudem nicht einig sind, ob es ein
      „Sportunfall“ oder ein „sonstiger Unfall“ war, und die Minuten bis
      zum Pausenende ungerührt weiterlaufen. Du erreichst die kühle
      Kellertreppe des NW-Trakts und nimmst die letzten Stufen mit einem
      einzigen großen, leicht zu forschen Satz.
    backwardText: >-
      Du stößt dich vom eiskalten Geländer ab, wischst dir den Staub von
      den Händen und verschwindest durch den nächsten schmalen Durchgang.
      Der Rückweg führt über dieselbe Hürdenstrecke aus Schulranzen –
      diesmal springst du vorsichtiger, kassierst aber trotzdem einen
      Schlag ans Schienbein, während die nächste Klasse schon ungeduldig
      wartet. Du bist zurück am Ausgangspunkt. Die Cafeteria-Uhr tickt wie
      ein Countdown, die Pausenglocke lauert bedrohlich nah, und irgendwo
      klappert schon das erste Tablett.
  - from: sporthalle
    to: bibliothek
    forwardText: >-
      Du duckst dich unter dem letzten Wurf weg, hechtest im Slalom um
      zwei Mitspieler und wirfst dich zur rettenden Seitentür hinaus. Der
      Weg führt über den Hinterflur, vorbei am Lager mit den Ersatzstühlen
      und einem Stapel alter Wandkarten, die niemand mehr braucht, dann
      eine kurze Treppe hoch, an der Schulküche vorbei, aus der es
      intensiv nach angebranntem Toast riecht, und schließlich durch die
      unscheinbare Seitentür, die direkt in die Bibliothek führt, vorbei
      am frisch aufgehängten Plakat für die nächste Buchausstellung. Die
      Bibliothekarin bewegt sich lautlos wie eine Spezialeinheit zwischen
      den Regalen, Zwille im Anschlag, und du hältst instinktiv den Atem
      an.
    backwardText: >-
      Ein Klick, ein Zwirbeln – ZWIIING! – ein Haargummi schnalzt dir
      haarscharf am Ohr vorbei, bevor du überhaupt reagieren kannst, und
      du bist durch die Tür. Du hastest denselben Hinterflur zurück,
      vorbei an Ersatzstühlen und alten Wandkarten, wieder an der nach
      Toast riechenden Schulküche vorbei, und stolperst direkt zurück in
      das tobende Völkerballspiel der Sporthalle.
  - from: sporthalle
    to: nw_trakt
    forwardText: >-
      Du duckst dich ein letztes Mal weg, hechtest durch die Seitentür der
      Sporthalle und stolperst in den dunklen Verbindungsgang, wo dich
      eine losgelöste Turnmatte fast zu Fall bringt und ein umgekippter
      Ballwagen den Weg versperrt; du kletterst hindurch und landest, noch
      außer Atem, auf der kühlen Kellertreppe mitten im NW-Trakt.
    backwardText: >-
      Du stößt dich vom eiskalten Geländer ab und wischst dir den Staub
      von den Knien, tapst zurück durch den dunklen Verbindungsgang – und
      stürzt direkt wieder mitten in ein neues Völkerballspiel der
      Sporthalle.
  - from: bibliothek
    to: ziel
    forwardText: >-
      Ein Klick, ein Zwirbeln – ZWIIING! – ein Haargummi schnalzt dir
      haarscharf am Ohr vorbei, bevor du überhaupt reagieren kannst, und
      du bist durch die Tür. Du kletterst kurzerhand aus dem
      Bibliotheksfenster, landest unsanft im Blumenbeet, rappelst dich auf
      und stürmst durch die Hintertür direkt in die Küche, wo die
      zwergenhaften Küchenkräfte entsetzt aufkreischen und Töpfe fallen
      lassen. Du kommst um die letzte Ecke: ein Lichtkegel fällt auf die
      Theke, genau auf den letzten Donut – und auf eine Hand, die schon
      danach greift.
    backwardText: >-
      Mit dem Donut sicher in der Hand drehst du dich noch einmal
      triumphierend um, kletterst durch die Küche zurück nach draußen,
      vorbei an den entsetzt aufkreischenden Küchenkräften, kraxelst durchs
      Blumenbeet zurück hoch und schwingst dich zurück durchs
      Bibliotheksfenster, direkt in die wartende Zwille der
      Bibliothekarin.
  - from: nw_trakt
    to: ziel
    forwardText: >-
      Du stößt dich vom eiskalten Geländer ab, wischst dir den Staub von
      den Händen und verschwindest durch den nächsten schmalen Durchgang.
      Herr Dr. Kessler, hochmotivierter Physiklehrer, hat aus dem Fenster
      des NW-Trakts eine improvisierte Seilbahn gespannt – „ideal für den
      Fallversuch!“ – und schnallt dich, bevor du protestieren kannst, in
      einen selbstgenähten Fallschirm, der sich erst zwei Meter über dem
      Boden mit einem lauten Rucken öffnet und dich einmal wild durch die
      Luft wirbeln lässt, mit dem du reichlich unsanft direkt vor der
      Cafeteria landest. Du kommst um die letzte Ecke: ein Lichtkegel
      fällt auf die Theke, genau auf den letzten Donut – und auf eine
      Hand, die schon danach greift.
    backwardText: >-
      Mit dem Donut sicher in der Hand drehst du dich noch einmal
      triumphierend um, doch bevor du fliehen kannst, taucht Herr Dr.
      Kessler grinsend mit seiner Seilbahn auf – „Rückflug gefällig, für
      die Statistik?“ – und zieht dich zurück durchs Fenster in den
      NW-Trakt.
  - from: pausenhalle
    to: nw_trakt
    forwardText: >-
      Du flüsterst ihnen knapp die Lösung zu, drückst für sie den Knopf
      und schlüpfst rasch weiter. Die Treppe zum NW-Trakt liegt gleich
      neben dem Ausgang der Pausenhalle, und du nimmst sie mit zwei Stufen
      auf einmal.
    backwardText: >-
      Du stößt dich vom eiskalten Geländer ab, wischst dir den Staub von
      den Händen und verschwindest durch den nächsten schmalen Durchgang.
      Die Treppe zum NW-Trakt liegt gleich neben dem Ausgang der
      Pausenhalle. Am Wasserspender blockiert eine ganze Traube
      Drittklässler das kniffelige Rätsel-Schloss.
  - from: pausenhalle
    to: ziel
    forwardText: >-
      Du flüsterst ihnen knapp die Lösung zu, drückst für sie den Knopf
      und schlüpfst rasch weiter. Die Cafeteria-Theke ist nur einen Sprung
      von der Pausenhalle entfernt. Du kommst um die letzte Ecke: ein
      Lichtkegel fällt auf die Theke, genau auf den letzten Donut – und
      auf eine Hand, die schon danach greift.
    backwardText: >-
      Mit dem Donut sicher in der Hand drehst du dich noch einmal
      triumphierend um und schlenderst zurück zur Pausenhalle, wo dich die
      Drittklässler am Wasserspender bereits dankbar erwarten.
  - from: bibliothek
    to: nw_trakt
    forwardText: >-
      Ein Klick, ein Zwirbeln – ZWIIING! – ein Haargummi schnalzt dir
      haarscharf am Ohr vorbei, bevor du überhaupt reagieren kannst, und
      du bist durch die Tür. Die Bibliothekarin packt dich unsanft am
      Kragen und wirft dich kurzerhand aus der Seitentür ins Treppenhaus –
      und du stehst benommen mitten im NW-Trakt, direkt vor der kühlen
      Kellertreppe.
    backwardText: >-
      Du stößt dich vom eiskalten Geländer ab und wischst dir den Staub
      von den Händen. Diesmal schleichst du dich lieber leise die Treppe
      zur Bibliothek hoch, an der Bibliothekarin vorbei, die dich mit
      zusammengekniffenen Augen und der Zwille im Anschlag beobachtet,
      aber gerade noch nicht abdrückt.
