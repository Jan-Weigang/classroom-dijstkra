nodes:
  start:
    start: true
    name: Der Startschuss
    short: Start
    blurb: Es klingelt gleich. Drei Routen liegen vor dir.
    intro: >-
      Noch wenige Minuten bis zur großen Pause. Im hintersten Winkel der
      Schulküche wartet der allerletzte Schoko-Donut, und du bist nicht der
      Einzige, der davon gehört hat. Plane deine Route, beweg dich leise,
      und sei zuerst an der Theke – bevor es klingelt.

  sporthalle:
    name: Die Sporthalle
    short: Sport.
    blurb: Bälle fliegen, Pfeifen schrillen – und mittendrin ein strenger Blick.

  nw_trakt:
    name: Der NW-Trakt
    short: NW-Trakt
    blurb: Chemiegeruch, Streit im Gang, und irgendwo ein aufgeregter Lehrer.

  bibliothek:
    name: Die Bibliothek
    short: Biblio.
    blurb: Angeblich der leiseste Ort der Schule. Angeblich.

  hof:
    name: Der Hof
    short: Hof
    blurb: Frische Luft, viel Platz – und ein Gerät, das Rätsel liebt.

  ziel:
    goal: true
    name: Die Theke – der letzte Donut
    short: Theke
    blurb: Ein Spotlight, ein Donut – die Frage ist nur, wessen Hand ihn schon hält.

# Der Text (und damit das Gewicht) lebt vollständig auf den Kanten: jede
# Kante trägt ein eigenständiges `forwardText` (von -> zu) und
# `backwardText` (zu -> von), Gewicht = Textlänge. Es gibt bewusst keine
# Knotentexte (entryText/exitText) - Knoten tragen nur Anzeigefelder
# (name/short/blurb/intro), nie gewichtsrelevanten Text. Das hält jede
# Kante vollständig unabhängig von jeder anderen.
#
# Knotennamen sind bewusst neutral (Ort, nicht Figur/Ereignis) - „Sporthalle“
# statt „Hausmeister“, „NW-Trakt“ statt „Keller“, „Hof“ statt irgendeiner
# Anspielung auf den Wasserspender -, damit der Graph selbst nichts von der
# Story verrät. Die verrät sich ausschließlich über den gelesenen Text.
#
# Wiederkehrende Figuren/Motive ziehen sich über mehrere Kanten: Hausmeister
# Brzenska (Start-Sporthalle), der Streit des Schulsanitätsdienstes über
# „Sportunfall“ vs. „sonstiger Unfall“ (Start-NW-Trakt, dort begonnen und in
# NW-Trakt-Hof sowie NW-Trakt-Bibliothek aufgegriffen), Herr Dr. Kessels
# Fallschirm-„Fallversuch“ (NW-Trakt-Hof), die als Spezialeinheit agierende
# Bibliothekarin mit ihrer Haargummi-Zwille (Start-Bibliothek,
# NW-Trakt-Bibliothek, Bibliothek-Ziel, Bibliothek-Hof) und das
# Rätsel-Schloss am Wasserspender (Hof-Ziel).
edges:
  - from: start
    to: sporthalle
    forwardText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan,
      kalkulierst kurz die Chancen gegen die Konkurrenz und legst
      blitzschnell los. Der Weg zur Sporthalle führt direkt an Hausmeister
      Brzenskas Kontrollposten vorbei; er verlangt wortlos deinen
      Schülerausweis, dreht ihn zweimal im Licht, stempelt ihn gleich
      dreimal und mustert dich mit zusammengekniffenen Augen, bevor er
      dich endlich durch die schwere Tür zur Halle winkt. Du stolperst
      mitten in ein tobendes Völkerballspiel; gleich drei Bälle fliegen
      synchron auf dich zu, und irgendjemand brüllt begeistert deinen
      Namen.
    backwardText: >-
      Du duckst dich unter dem letzten Wurf weg, hechtest im Slalom um
      zwei Mitspieler und wirfst dich zur rettenden Seitentür hinaus.
      Hausmeister Brzenska hält dich noch einmal auf, verlangt erneut
      deinen Schülerausweis, nickt diesmal knapp und winkt dich durch. Du
      bist zurück am Ausgangspunkt. Die Cafeteria-Uhr tickt wie ein
      Countdown, die Pausenglocke lauert bedrohlich nah, und irgendwo
      klappert schon das erste Tablett.
  - from: start
    to: nw_trakt
    forwardText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan,
      kalkulierst kurz die Chancen gegen die Konkurrenz und legst
      blitzschnell los. Der direkte Weg zum NW-Trakt führt über eine
      improvisierte Hürdenstrecke aus Schulranzen, die eine ganze Klasse
      mitten im Flur liegen gelassen hat; beim Sprung über den letzten
      Ranzen verlierst du das Gleichgewicht und schlägst dir hart das Knie
      auf. Der Schulsanitätsdienst ist sofort zur Stelle – zwei
      Fünftklässler mit Verbandskasten und grimmiger Entschlossenheit –,
      doch bevor sie auch nur ein Pflaster auspacken dürfen, muss erst ein
      dreiseitiges Unfallprotokoll ausgefüllt werden, während die beiden
      Sanitäter sich zudem nicht einig sind, ob es ein „Sportunfall“ oder
      ein „sonstiger Unfall“ war. Du lässt sie streiten, nimmst die Treppe
      zwei Stufen auf einmal nach oben und stehst, noch etwas humpelnd, im
      NW-Trakt.
    backwardText: >-
      Du lässt den Streit der beiden Sanitäter über „Sportunfall“ oder
      „sonstiger Unfall“ hinter dir, nimmst die Treppe nach unten –
      diesmal vorsichtiger – und kassierst am Fuß der Stufen trotzdem
      einen Schlag ans Schienbein von der immer noch herumliegenden
      Hürdenstrecke aus Schulranzen. Du bist zurück am Ausgangspunkt. Die
      Cafeteria-Uhr tickt wie ein Countdown, die Pausenglocke lauert
      bedrohlich nah, und irgendwo klappert schon das erste Tablett.
  - from: start
    to: bibliothek
    forwardText: >-
      Du scannst die drei möglichen Routen wie einen Fluchtplan,
      kalkulierst kurz die Chancen gegen die Konkurrenz und legst
      blitzschnell los. Der Weg zur Bibliothek führt eine schmale Treppe
      hinunter, vorbei an vergilbten Aushängen und einem Stapel
      ausrangierter Stühle, bis du unten vor der schweren Tür mit dem
      Schild „Bibliothek – bitte leise“ stehst und sie so lautlos wie
      möglich öffnest. Die Bibliothekarin bewegt sich lautlos wie eine
      Spezialeinheit zwischen den Regalen, Zwille im Anschlag, und du
      hältst instinktiv den Atem an.
    backwardText: >-
      Du schleichst rückwärts aus der Bibliothek, ein Haargummi schnalzt
      dir noch hinterher, und nimmst die schmale Treppe wieder nach oben,
      zwei Stufen auf einmal. Du bist zurück am Ausgangspunkt. Die
      Cafeteria-Uhr tickt wie ein Countdown, die Pausenglocke lauert
      bedrohlich nah, und irgendwo klappert schon das erste Tablett.
  - from: sporthalle
    to: hof
    forwardText: >-
      Du duckst dich unter einem Ball weg, hechtest zur Seite, duckst dich
      unter dem nächsten – dreimal, viermal – und wirfst dich im letzten
      Moment durch die Seitentür, gerade so ungetroffen, hinaus auf den
      Hof.
    backwardText: >-
      Du drückst dich noch einmal durch dieselbe Seitentür zurück in die
      Sporthalle – und stehst prompt wieder mitten in einem neuen Anwurf,
      drei Bälle gleichzeitig im Anflug.
  - from: sporthalle
    to: ziel
    forwardText: >-
      Mit einem letzten, spektakulären Wurf triffst du den letzten
      Gegner – das Spiel ist gewonnen! Deine Mitspieler jubeln, kapern
      kurzerhand den Mattenwagen aus der Ecke, hieven dich hinauf, hissen
      eine Piratenflagge aus einem Handtuch, und im Triumphzug rollst du,
      laut skandiert, direkt zur Cafeteria-Theke.
    backwardText: >-
      Mit dem Donut sicher in der Hand lässt du dich vom Mattenwagen
      herunter und gehst, angefeuert von entfernten Jubelrufen, noch
      einmal zurück in die Sporthalle, wo bereits das nächste Spiel
      begonnen hat.
  - from: nw_trakt
    to: hof
    forwardText: >-
      Der Schulsanitätsdienst streitet immer noch über „Sportunfall“ oder
      „sonstiger Unfall“, als du dich unbemerkt in den nächsten
      Physikraum flüchtest. Herr Dr. Kessler, hochmotivierter
      Physiklehrer, sieht sofort eine Gelegenheit für den „Fallversuch“,
      schnallt dich ohne weitere Diskussion in einen selbstgenähten
      Fallschirm und wirft dich kurzerhand aus dem Fenster – du landest,
      reichlich unsanft, mitten auf dem Hof.
    backwardText: >-
      Herr Dr. Kessler winkt dir vom Fenster aus fröhlich zu – „Nächster
      Testflug gefällig?“ – doch du schüttelst den Kopf und kletterst
      stattdessen brav die Treppe zurück hoch in den NW-Trakt, wo der
      Streit der Sanitäter noch immer nicht entschieden ist.
  - from: nw_trakt
    to: bibliothek
    forwardText: >-
      Du nutzt den Streit der Sanitäter über die richtige Unfallkategorie
      aus, murmelst etwas von „ich hol schnell die Unterschrift der
      Klassenleitung“ und schleppst dich, das Knie noch schmerzend, über
      die Hintertreppe direkt in die Bibliothek. Die Bibliothekarin bewegt
      sich lautlos wie eine Spezialeinheit zwischen den Regalen, Zwille im
      Anschlag, und du hältst instinktiv den Atem an.
    backwardText: >-
      Du schleichst dich aus der Bibliothek und die Hintertreppe wieder
      hoch, an der Bibliothekarin vorbei, die dich mit zusammengekniffenen
      Augen und gespannter Zwille beobachtet, und stehst wieder mitten im
      Streit des Schulsanitätsdienstes im NW-Trakt.
  - from: bibliothek
    to: ziel
    forwardText: >-
      Um dich herum werden reihenweise Mitschüler von Haargummis
      abgeschossen, einer nach dem anderen, wie am D-Day; unter lautem
      ZWIIING-ZWIIING-ZWIIING kämpfst du dich geduckt durch die
      Regalreihen und schaffst es, mit einem letzten Hechtsprung durch die
      Tür, hinaus zur Cafeteria-Theke.
    backwardText: >-
      Mit dem Donut sicher in der Hand kämpfst du dich noch einmal zurück
      durch das ZWIIING-Kreuzfeuer der Regalreihen, tief geduckt, zurück
      in die Bibliothek, wo die Schlacht unvermindert weitergeht.
  - from: bibliothek
    to: hof
    forwardText: >-
      Ein Buch rutscht dir aus der Hand und klatscht viel zu laut auf den
      Boden – die Bibliothekarin fährt herum, Zwille bereits gespannt, und
      du bist plötzlich selbst das Ziel. Du hechtest zur nächsten Tür und
      flüchtest hinaus auf den Hof, ein Haargummi schnalzt noch knapp an
      deinem Ohr vorbei.
    backwardText: >-
      Du schleichst zurück durch dieselbe Tür in die Bibliothek, in der
      Hoffnung, dass die Bibliothekarin dich diesmal übersieht – die
      Zwille ist noch gespannt, aber sie zielt gerade woanders hin.
  - from: hof
    to: ziel
    forwardText: >-
      Am Wasserspender blockiert eine ganze Traube Drittklässler das
      kniffelige Rätsel-Schloss. Du flüsterst ihnen knapp die Lösung zu,
      drückst für sie den Knopf, und schlüpfst rasch weiter zur
      Cafeteria-Theke.
    backwardText: >-
      Mit dem Donut sicher in der Hand drehst du dich noch einmal um und
      schlenderst zurück zum Hof, wo dich die Drittklässler am
      Wasserspender bereits dankbar erwarten.
